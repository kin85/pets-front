<div class="page">
  <div class="card">
    <div class="brand">
      <div class="logo" aria-hidden="true">🐾</div>
      <div>
        <h1>Pets</h1>
        <p class="subtitle">Accede a tu cuenta</p>
      </div>
    </div>

    <form (ngSubmit)="submit()" #f="ngForm" class="form">
      <label class="field">
        <span>Usuario</span>
        <input name="username" [(ngModel)]="username" required autocomplete="username" placeholder="usuario" />
      </label>

      <label class="field">
        <span>Contraseña</span>
        <input name="password" type="password" [(ngModel)]="password" required autocomplete="current-password" placeholder="••••••••" />
      </label>

      <button class="btn" type="submit" [disabled]="loading || f.invalid">
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>

      @if (error) {
        <p class="error">{{ error }}</p>
      }

      <div class="divider"><span>o</span></div>

      <a class="link" [routerLink]="['/register']">Crear una cuenta</a>
    </form>
  </div>

  <p class="footnote">© {{ year }} Pets</p>
</div>
